# ==============================================================================
# PC 5: Notification Service (Krish Chothani - Windows)
# Components:
#   - Database: Google Firestore Emulator (Port 8088)
#   - Microservice: Notification & Alerting Service (Node.js 20 / Express) (Port 8085)
# ==============================================================================
# Usage:
#   docker compose -f deploy/multi-pc/docker-compose.pc5.yml up -d --build
# ==============================================================================

version: '3.8'

services:
  # === Google Cloud Firestore Emulator ===
  firestore-emulator:
    image: google/cloud-sdk:489.0.0-emulators
    container_name: stp-pc5-firestore
    command: >
      gcloud emulators firestore start 
      --host-port=0.0.0.0:8088 
      --project=stp-local
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pc5-network

  # === Notification Service (Node.js Express) ===
  notification-service:
    build:
      context: ../../apps/notification-service
      dockerfile: Dockerfile
    container_name: stp-pc5-notification-service
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8088
      - FIRESTORE_PROJECT_ID=stp-local
      - "KAFKA_BOOTSTRAP_SERVERS=${PC1_IP:?PC1_IP_must_be_set_in_env}:9093"
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me-in-production-this-must-be-at-least-256-bits-long-for-hs256}
    depends_on:
      firestore-emulator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pc5-network

networks:
  pc5-network:
    name: stp-pc5-network
