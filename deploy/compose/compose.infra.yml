# ============================================
# Infrastructure Docker Compose
# Databases, Kafka, and supporting services
# ============================================
# Usage: docker compose -f deploy/compose/compose.infra.yml up -d

services:
  # === PostgreSQL (Identity & Wallet Service) ===
  postgres:
    image: postgres:16.4-alpine
    container_name: stp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity_wallet_db}
      POSTGRES_USER: ${POSTGRES_USER:-iw_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/databases/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iw_service} -d ${POSTGRES_DB:-identity_wallet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stp-network

  # === MongoDB (Market Data Service) ===
  mongodb:
    image: mongo:7.0.14
    container_name: stp-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-md_service}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-dev_mongo_pass}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-market_data_db}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ../../infra/databases/mongodb/init.js:/docker-entrypoint-initdb.d/01-init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGODB_USER:-md_service}", "-p", "${MONGODB_PASSWORD:-dev_mongo_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stp-network

  # === MySQL (Order Service) ===
  mysql:
    image: mysql:8.0.39
    container_name: stp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_mysql_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-order_service_db}
      MYSQL_USER: ${MYSQL_USER:-order_service}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_mysql_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../infra/databases/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --binlog-format=ROW
      --binlog-row-image=FULL
      --log-bin=mysql-bin
      --server-id=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-dev_mysql_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stp-network

  # === Redis (Portfolio Service) ===
  redis:
    image: redis:7.4-alpine
    container_name: stp-redis
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-dev_redis_pass}
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --save 300 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stp-network

  # === Firestore Emulator (Notification Service) ===
  firestore-emulator:
    image: google/cloud-sdk:489.0.0-emulators
    container_name: stp-firestore
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8088
      --project=stp-local
    ports:
      - "${FIRESTORE_PORT:-8088}:8088"
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8088
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - stp-network

  # === Zookeeper (for Kafka) ===
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: stp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - stp-network

  # === Kafka ===
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: stp-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Three listeners:
      # INTERNAL - for Docker-to-Docker communication (containers use kafka:29092)
      # EXTERNAL - for host machine access (localhost:9092)
      # LAN - for multi-PC access (LAN_IP:9093)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,LAN:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,LAN://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,LAN://${INFRA_HOST:-localhost}:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:29092", "1", "10"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - stp-network

  # === Kafka Topic Initialization ===
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: stp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.created --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.accepted --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.rejected --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.executed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.cancelled --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades.executed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic wallet.reservation.completed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic wallet.reservation.failed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic market.price.updated --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic portfolio.updated --partitions 3 --replication-factor 1
      
      # Dead-letter topics
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.created.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades.executed.dlq --partitions 1 --replication-factor 1
      
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      echo 'Kafka topic initialization complete.'
      "
    networks:
      - stp-network

volumes:
  postgres_data:
    name: stp-postgres-data
  mongodb_data:
    name: stp-mongodb-data
  mysql_data:
    name: stp-mysql-data
  redis_data:
    name: stp-redis-data
  zookeeper_data:
    name: stp-zookeeper-data
  zookeeper_log:
    name: stp-zookeeper-log
  kafka_data:
    name: stp-kafka-data

networks:
  stp-network:
    name: stp-network
    driver: bridge
