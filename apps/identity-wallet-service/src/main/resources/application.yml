# ============================================
# Identity & Wallet Service - Application Config
# ============================================

spring:
  application:
    name: identity-wallet-service

  # === PostgreSQL DataSource ===
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:${INFRA_HOST:localhost}}:${POSTGRES_PORT:5432}/${POSTGRES_DB:identity_wallet_db}}
    username: ${POSTGRES_USER:iw_service}
    password: ${POSTGRES_PASSWORD:dev_postgres_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 600000

  # === JPA ===
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # === Flyway ===
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # === Kafka ===
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${INFRA_HOST:localhost}:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

# === Server ===
server:
  port: ${IDENTITY_SERVICE_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

# === JWT ===
app:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-me-in-production-this-must-be-at-least-256-bits-long-for-hs256}
    issuer: ${JWT_ISSUER:stock-trading-platform}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  wallet:
    initial-balance-paise: ${INITIAL_BALANCE_PAISE:10000000}

# === Actuator ===
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: identity-wallet-service

# === Logging ===
logging:
  level:
    com.stp.identity: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","service":"identity-wallet-service","logger":"%logger{36}","message":"%msg","thread":"%thread"}%n'
